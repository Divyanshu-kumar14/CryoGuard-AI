[project]
name = "cryoguard"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
  "pydantic==2.14.2",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = [
  "mypy==1.19.1",
  "pytest==9.2.0",
  "ruff==0.17.3",
  "types-pyyaml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["acceptance: P0 acceptance suite"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
