# CryoGuard AI — default configuration.
# Every value is a design prior or a stated physical assumption. None is a measured
# result. The file is hashed at startup and the hash goes into every incident.

schema_version: "1.0"

system:
  rack_id: "RACK-08B"
  branch_id: "BRANCH-SEC-02"
  sampling_rate_hz: 5          # NFR-LAT-01: decision tick is fixed at 5 Hz
  camera_source: "fixtures/videos/simulated/sim_leak_qd4.mp4"
  incident_epoch: "2026-10-30T00:00:00Z"   # scenario time; keeps reruns byte-identical
  rectify_enabled: true
  allow_uncalibrated: false    # delta C-07: identity homography is dev-only
  maintenance_mode: false      # Zone 2 is never suppressed (FR-DEC-05)

camera:
  fps: 30
  px_per_mm: 2.0              # rectified canvas scale: 1200 x 800 for a 600 x 400 mm face
  health:
    brightness_min: 20.0
    brightness_max: 235.0
    focus_min: 15.0            # Laplacian variance
    saturation_max: 0.35       # the ArUco quiet zones are white by design (~20% of a
                               # rectified view); this catches a blown sensor, not fiducials
    max_frame_age_s: 0.1

perception:
  idle_hz: 2                   # D-18
  track_hz: 5
  suspect_hz: 10
  # Fluorescence gate for a long-pass filtered camera under UV excitation.
  hue_min: 25                  # OpenCV hue, 0-179; yellow-green tracer
  hue_max: 95
  sat_min: 80
  value_min: 60
  morph_open_px: 3
  morph_close_px: 5
  growth_window: 5             # samples in the dA/dt least-squares slope
  min_area_mm2: 4.0
  max_area_mm2: 5000.0
  link_radius_mm: 25.0
  candidate_ttl_ticks: 3       # FR-PER-05: shorter-lived candidates are GLINT_NOISE
  solidity_ref: 0.6            # area / convex hull; robustness to a wet trail
  exposure_clip_max: 0.05      # hard gate: a mostly-blown-out mask cannot localise
  q_min: 0.5                   # mask quality gate for R1/R2
  wetness_ticks: 3             # FR-FUS-05: continuous path to the QD ROI
  reanchor_radius_mm: 15.0     # SAM mask -> existing track association

sam:
  mode: "off"                  # off | cache | live; cache never touches the network
  model: "sam-3.1"
  base_url: "https://api.meta.ai/v1"
  timeout_sec: 4.0
  async_rate_hz: 1.0           # D-02: <= 2 Hz
  in_flight: 1
  prompt_max_tokens: 32        # hosted API limit
  mask_threshold: 127          # grayscale >= threshold is foreground
  max_retries: 1
  roi_margin_mm: 10.0
  anchor_ttl_s: 1.2            # a SAM anchor bridges the gap to the next call
  cache_dir: "artifacts/sam_cache"
  prompts:
    # Default coolant prompt. Honest limitation: the 2026-10-31 live audit
    # (artifacts/sam_live_audit.json) returned zero matches for this phrasing
    # and for two alternates on two synthetic crops. Zero matches is a valid
    # empty lane, not an error. Earlier notes claimed alternate phrasings
    # produced masks; that result was not reproduced. The default is kept
    # anyway: selecting a prompt because it yields masks would be overfitting
    # to the demo clip. Trial alternates offline with
    # SamClient.evaluate_prompts, which records every prompt and its result
    # without ranking them.
    coolant: "fluorescent yellow liquid droplet"
    condensation: "water bead on metal"

telemetry:
  dt_s: 0.2
  baseline_s: 10.0
  pressure_min_psi: 20.0
  pressure_max_psi: 45.0
  flow_min_lpm: 5.0
  flow_max_lpm: 15.0
  surface_temp_min_c: 15.0
  surface_temp_max_c: 50.0
  air_temp_min_c: 20.0
  air_temp_max_c: 30.0
  rh_min_pct: 20.0
  rh_max_pct: 80.0

fusion:
  # Canonical weights, PRD §9. Hand-set priors (D-03): never described as calibrated.
  weights:
    w_visual: 1.85
    w_hydraulic: 2.10
    w_thermal: 1.25
    w_wetness: 2.50
    bias: -2.80

  visual:
    alpha: 0.4
    beta: 0.4
    gamma: 0.2
    # PRD §7.3 divides dA/dt by A_ref but leaves A_ref as an area. At 50 mm2 the
    # growth term contributes ~2% of phi_v, which makes the anti-glint signal
    # numerically irrelevant. Defined here as a growth RATE reference.
    growth_ref_mm2_per_s: 2.0
    contrast_max: 1.0

  hydraulic:
    w_pressure: 0.6
    w_flow: 0.4
    pressure_rate_ref_psi_per_s: 2.0
    flow_imbalance_ref_lpm: 0.5

  thermal:
    # PRD FR-FUS-01: phi_t = (T_surface - T_dewpoint) / dt_scale_c. Neutral at the
    # dew point itself; no extra margin, because that point is physical.
    dt_scale_c: 5.0

  thresholds:
    nominal_cutoff: 0.40
    suspect_cutoff: 0.50
    escalation_cutoff: 0.70
    confirmed_leak: 0.85
    zone2_trip: 0.50
    deescalation_margin: 0.05

decision:
  hysteresis_ticks: 3
  hydraulic_hold_ms: 3000       # R4 needs 3 s of hydraulic-only evidence
  deescalation_ticks: 5         # PRD §6.4 is tick-based; no wall-clock knob
  growth_epsilon_mm2_per_s: 0.5   # delta R-1: a static reflection must not trip
  hydraulic_confirm_phi: 0.20
  benign_phi_h_max: 0.10           # R5 condensation branch
  zone:
    origin: 0
    electrical: 2

orchestrator:
  protocol_mode: "loopback"     # loopback | external | memory
  clamp_latency_ms: 40
  clamp_readback_timeout_ms: 2000
  clamp_tolerance_w: 5.0
  valve_verified_ms: 1200
  valve_fault_ms: 1500
  checkpoint_budget_ms: 30000
  checkpoint_dir: "artifacts/checkpoints/demo"
  checkpoint_step: 4200
  bmc_graceful_timeout_ms: 10000

watchdog:
  enabled: true
  fallback_enabled: true    # independent direct-BMC ForceOff if the primary actuation fails;
                            # timeouts reuse bmc.timeout_ms / bmc.power_off_timeout_ms (no second knob)
  period_ms: 100              # its own task, independent of the fusion loop
  max_staleness_ms: 500       # a sample older than this is a blind sensor
  max_frozen_ticks: 15        # 15 x period = 1.5 s of a byte-identical trace under load
  # Sustained-load hysteresis: one utilization spike must not arm the freeze
  # detector. Load latches after sustained_load_ticks consecutive ticks above
  # the min thresholds and releases only below the release thresholds.
  sustained_load_min_util_pct: 10.0
  sustained_load_min_power_w: 70.0
  sustained_load_ticks: 5
  sustained_load_release_util_pct: 5.0
  sustained_load_release_power_w: 50.0
  # The limit is thermal_model.watchdog_limit_c (90 C), which is validated to
  # sit below thermal_model.t_junction_max_c. One knob, no duplicate literal.

nvml:
  backend: "fake"
  fake_min_limit_w: 200.0
  fake_junction_c: 42.0       # SIMULATED GPU temperature; the fake sensor never runs hot
  fake_num_gpus: 4
  fake_loaded: false          # SIMULATED load flag; true arms sustained-load tracking
  device_index: 0             # real backend: NVML device ordinal (NVML_TEMPERATURE_GPU)

plc:
  host: "127.0.0.1"
  port: 5020                  # 502 requires root; documented in README
  unit_id: 1
  valve_travel_ms: 950
  valve_slow_ms: 1200         # <= slow: VERIFIED; <= fault: VERIFIED_SLOW; above: FAULT
  valve_fault_ms: 1500
  depressurize_ms: 500
  depressurized_max_psi: 5.0       # BOTH witnesses must agree: DI 1002 AND pressure <= this
  depressurize_timeout_ms: 1500    # limit closed but still above max => VALVE_SEAL_LEAK
  depressurize_confirm_reads: 3    # N consecutive agreeing depressurized reads before VERIFIED
  depressurize_hysteresis_psi: 2.0 # release margin: confirm <= max, refute >= max + hyst
  open_pressure_psi: 34.0
  nominal_flow_lpm: 9.0
  tick_ms: 20
  poll_ms: 10                 # client poll interval while waiting for the limit switch
  client_timeout_ms: 2000     # per-request Modbus timeout

bmc:
  base_url: "http://127.0.0.1:8443"   # mock only, no TLS, no auth, host-local
  host: "127.0.0.1"
  port: 8443
  node_id: "gpu-node-08b"
  simulated: true                     # set false only for a real BMC
  timeout_ms: 2000
  max_retries: 2
  retry_backoff_ms: 50
  poll_interval_ms: 200              # power-state readback cadence after an accepted reset
  power_off_timeout_ms: 3000         # unverified power-off becomes FAILED_SAFE
  token_env: "CRYOGUARD_BMC_TOKEN"    # optional; secrets only via the environment

thermal_model:
  c_th_j_per_k: 350.0      # assumption, not a measurement (PRD D-07)
  q_load_w: 1000.0
  q_idle_w: 200.0
  t_junction_max_c: 105.0
  watchdog_limit_c: 90.0

scheduler:
  kind: "slurm-mock"
  job_id: "train-llm-0427"
  node: "gpu-node-08b"
  standby_node: "gpu-node-09a"
  gpus: 4
  train_interval_s: 1.0
  checkpoint_every_s: 10.0

report:
  enabled: true                # attempt Muse only when MUSE_API_KEY is present
  provider: "baseten"
  model: "meta-models/muse-spark-open-1026"
  base_url: "https://inference.baseten.co/v1"
  api_key_env: "MUSE_API_KEY"  # secret only via the environment
  timeout_ms: 15000
  max_retries: 1
  max_tokens: 600   # small by design: bounds cost/latency per incident. Muse Spark
                    # Open is a reasoning model, so 600 can be consumed by reasoning
                    # before JSON content (finish_reason=length -> truncated_length
                    # in the proof log). Raise via BASETEN_MAX_TOKENS=2400 only for
                    # a live report; every extra token costs on every incident.
  prompts: "configs/prompts.yaml"
  proof_log: "artifacts/open_weights_proof.jsonl"
  # The deterministic fallback is unconditional (NFR-SAF-01): it is not a toggle.

bench:
  split: "all"                 # the split is provisional (2 clips per side); report both
  manifest: "fixtures/manifest.yaml"
  confidence: 0.95             # drives the Clopper-Pearson interval

demo:
  run_index: 1                 # base; a fixed scenario offset is added (01..04)
  out_dir: "artifacts/incidents"
