# Chassis-plane geometry in millimetres. PLACEHOLDER VALUES: replace with the
# measured rig before any millimetre claim is made (D-19). Zone polygons already
# include the 20 mm electrical margin (PRD §6.1).

schema_version: "1.0"

chassis:
  width_mm: 600
  height_mm: 400
  aruco:
    dictionary: "DICT_5X5_100"
    marker_size_mm: 100
    min_markers: 2               # one marker = 4 points = no redundancy, no error estimate
    # 30 mm of white quiet zone on every side; a 100 mm marker centred at 50 mm
    # would sit flush with the chassis edge and be undetectable.
    markers:
      - {id: 0, center_mm: [80, 80]}
      - {id: 1, center_mm: [520, 80]}
      - {id: 2, center_mm: [520, 320]}
      - {id: 3, center_mm: [80, 320]}

zones:
  - id: 0
    name: "Hydraulic origin"
    polygon_mm: [[40, 60], [240, 60], [240, 220], [40, 220]]
  - id: 1
    name: "Containment buffer"
    polygon_mm: [[20, 240], [280, 240], [280, 320], [20, 320]]
  - id: 2
    name: "Electrical hazard plane"
    margin_mm: 20
    polygon_mm: [[300, 40], [580, 40], [580, 360], [300, 360]]

qd:
  - id: "QD-04"
    branch: "BRANCH-SEC-02"
    roi_mm: [60, 90, 140, 170]     # x0, y0, x1, y1
    zone: 0

nodes:
  - id: "gpu-node-08b"
    gpus: ["GPU-0", "GPU-1", "GPU-2", "GPU-3"]
  - id: "gpu-node-09a"
    gpus: ["GPU-0", "GPU-1", "GPU-2", "GPU-3"]
